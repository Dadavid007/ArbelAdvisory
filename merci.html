<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Merci — Arbel Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#14213D 0%,#0E1830 60%,#1B2D52 100%); font-family:"Manrope",system-ui,Arial,sans-serif; color:#FFFFFF; padding:24px; box-sizing:border-box; }
  .carte { max-width:520px; text-align:center; }
  .eyebrow { color:#B8975A; font-size:.75rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; margin:0 0 16px; }
  h1 { font-size:clamp(1.8rem,4vw,2.4rem); font-weight:800; line-height:1.2; margin:0 0 20px; }
  p { color:#D6DCE8; font-size:1.02rem; line-height:1.7; margin:0 0 32px; }
  .btn { display:inline-block; background:#B8975A; color:#14213D; padding:14px 28px; border-radius:4px; font-weight:700; text-decoration:none; font-size:.95rem; }
  .btn:hover { background:#C9A96E; }
</style>
</head>
<body>
  <main class="carte">
    <p class="eyebrow">Arbel Advisory</p>
    <h1>Merci pour votre message.</h1>
    <p>Votre demande nous est bien parvenue. Nous revenons vers vous rapidement, au créneau que vous avez indiqué.</p>
    <a class="btn" href="https://arbeladvisory.fr">Retour à l'accueil</a>
  </main>
</body>
</html>
